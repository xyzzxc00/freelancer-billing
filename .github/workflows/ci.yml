name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小權限原則：這個 workflow 只需要讀取程式碼，不需要寫入權限
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      RESEND_API_KEY: ""
      RESEND_FROM_EMAIL: "測試 <noreply@example.com>"
      RESEND_DAILY_LIMIT: "90"
      ADMIN_EMAIL: "admin@example.com"
      CRON_SECRET: "dummy"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 對齊 Vercel 專案設定的 Node 24.x，CI 才測得到正式環境實際跑的版本
          node-version: 24
          cache: npm

      - name: Install dependencies
        # 原本改成 npm ci 想要更嚴格的鎖定版本保證，但這個相依樹裡 sharp/tailwindcss
        # oxide/unrs-resolver 都帶了 wasm32-wasi 平台的 optionalDependencies 子樹，
        # npm 寫 lockfile 時不保證每次都把未用到平台的子樹完整收斂進去（npm 已知行為，
        # 非本專案特有），導致 npm ci 在 Linux runner 上間歇性誤判 lockfile 不同步、
        # 即使本機剛驗證過 npm ci 通過也一樣會炸。改回 npm install。
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test

      - name: Build
        run: npx next build
